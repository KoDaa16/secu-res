#!/usr/sbin/nft -f
#
# EXAMEN IR252 - Nftables
# Chaque bloc est annote avec le NUMERO DU CRITERE de l'enonce.
#
# /!\ A VERIFIER / ADAPTER LE JOUR J :
#   - Nom des interfaces  : ip -br a   (l'ordre enp0s3/8/9 peut varier !)
#   - IP du serveur DMZ   : l'enonce indique le reseau 172.16.1.0/16
#   - WAN en ACCES PAR PONT -> plage du reseau de l'ecole
#

flush ruleset

define WAN = "enp0s3"
define LAN = "enp0s8"
define DMZ = "enp0s9"

define SRV_DMZ = 172.16.1.10          # <-- ADAPTER a l'IP reelle du serveur web
define NET_LAN = 192.168.1.0/24

table inet filter {

    # ---- CRITERE 8 : set nomme "blocked_hosts" -------------------------
    # Ces 2 hotes du LAN n'ont PAS acces a Internet ; le reste du LAN oui.
    # (pas de "flags interval" : ce sont des adresses isolees, pas des plages)
    set blocked_hosts {
        type ipv4_addr
        elements = { 192.168.1.50, 192.168.1.51 }
    }


    chain input {
        # CRITERE 1 : politique par defaut = tout bloquer
        type filter hook input priority filter; policy drop;

        # CRITERE 5 : loopback
        iif "lo" accept

        # CRITERE 4 : sessions deja etablies
        ct state established,related accept
        ct state invalid drop

        # CRITERE 7 : SEUL le serveur Web-SSH peut pinger le pare-feu,
        # quelle que soit l'interface -> on filtre sur la SOURCE,
        # et on ne met PAS de iifname (= n'importe quelle interface).
        # /!\ Ne PAS mettre de regle "icmp type echo-request accept" generique,
        #     sinon tout le monde pourrait pinger (regle trop permissive).
        ip saddr $SRV_DMZ icmp type echo-request accept
    }


    chain forward {
        # CRITERE 1 : politique par defaut = tout bloquer
        type filter hook forward priority filter; policy drop;

        # CRITERE 4 : sessions deja etablies
        ct state established,related accept
        ct state invalid drop

        # ---- CRITERE 8 (suite) : blocage AVANT les autorisations --------
        iifname $LAN oifname $WAN ip saddr @blocked_hosts drop

        # ---- CRITERE 2 : LAN -> Internet, CHIFFRE UNIQUEMENT ------------
        # "seulement de maniere chiffree" = HTTPS/443 seulement.
        iifname $LAN oifname $WAN ip saddr $NET_LAN tcp dport 443 accept
        # DNS necessaire pour resoudre les noms (sinon rien ne marche) :
        iifname $LAN oifname $WAN ip saddr $NET_LAN \
            meta l4proto { tcp, udp } th dport 53 accept

        # ---- CRITERE 3 : LAN -> site web DMZ en HTTP, ET SEULEMENT LUI --
        # On cible l'IP du serveur ET le port 80 (pas tout le reseau DMZ).
        iifname $LAN oifname $DMZ ip daddr $SRV_DMZ tcp dport 80 accept

        # ---- CRITERES 6 + 9 : WAN -> SSH du serveur DMZ (port 61337) ----
        # Le DNAT (table nat) a DEJA traduit la destination :
        # on filtre donc sur l'IP INTERNE et le port 22, PAS sur 61337 !
        # CRITERE 9 : on logge les NOUVELLES connexions, puis on accepte.
        # ("log" est une action NON terminale : elle trace puis l'evaluation
        #  continue vers l'action suivante, ici accept.)
        iifname $WAN oifname $DMZ ip daddr $SRV_DMZ tcp dport 22 \
            ct state new log prefix "SSH-DMZ: " accept
    }


    chain output {
        # CRITERE 1 : politique par defaut = tout bloquer
        type filter hook output priority filter; policy drop;

        # CRITERE 5 : loopback
        oif "lo" accept

        # CRITERE 4 : sessions deja etablies (fait repartir les reponses,
        # dont les echo-reply du ping du critere 7)
        ct state established,related accept
    }
}


table ip nat {

    chain prerouting {
        type nat hook prerouting priority dstnat;

        # CRITERE 6 : DNAT du SSH publie -> 61337 (cote Internet) vers 22 (serveur)
        iifname $WAN tcp dport 61337 dnat to $SRV_DMZ:22
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;

        # CRITERE 2 : SNAT pour que le LAN puisse sortir sur Internet
        # (sans lui, Internet repondrait a une IP privee non routable)
        oifname $WAN ip saddr $NET_LAN masquerade
    }
}
